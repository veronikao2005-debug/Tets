<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tets</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1f1f1d;
      --muted: #6b6b66;
      --accent: #c96442;
      --card: #ffffff;
      --border: #e5e4df;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a18;
        --fg: #ececea;
        --muted: #a3a39c;
        --accent: #e08a67;
        --card: #242422;
        --border: #3a3a36;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
    }
    h1 { margin: 0 0 8px; font-size: 1.75rem; }
    p { margin: 0 0 20px; color: var(--muted); }
    button {
      font: inherit;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    #count { margin-left: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Hello from Tets</h1>
    <p>This is a starter HTML page. Edit <code>index.html</code> to make it your own.</p>
    <button id="btn" type="button">Click me</button>
    <span id="count">0 clicks</span>
  </main>
  <script>
    let clicks = 0;
    const count = document.getElementById('count');
    document.getElementById('btn').addEventListener('click', () => {
      clicks += 1;
      count.textContent = clicks + (clicks === 1 ? ' click' : ' clicks');
    });
  </script>
</body>
</html>
